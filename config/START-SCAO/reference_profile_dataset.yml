# 450 independent observations, no pilot and no prescribed training split.
# Select one observation with run_psf_grid.py run --observation INDEX.
science_time: 10.0
settling_time: 1.0
short_frames: 100
long_exposure: 10.0
field_width_arcsec: 21.0
grid_size: 32
nd: 2.0
stamp_size: 128
bands_nm: {J: 1250.0, K: 2200.0}
campaign:
  name: reference_profile
  kind: reference
  profile_catalog: oya2014_profiles.yml
  profiles: [good, moderate, bad]
  zenith_angles_deg: [0, 15, 30, 45, 60]
  wind_speed_scales: [0.5, 1.0, 2.0]
  realizations: 10
  # One jittered global wind rotation in each of ten angular strata per cell.
  sampler_seed: 20261102
  simulation_seed_start: 1000000
  # 507 m at the configured pitch: covers 11 s at up to 38.12 m/s.
  pixel_phasescreens: 16384
